function makeOptions(r,correct,raw){let opts=[String(correct)],counter=0;for(let n of r.shuffle(raw)){const v=String(n);if(v!==String(correct)&&!opts.includes(v))opts.push(v);if(opts.length===4)break;}while(opts.length<4&&counter++<60){let v=String(correct+r.int(-15,15));if(v!==String(correct)&&!opts.includes(v))opts.push(v);}return r.shuffle(opts);}
function makeFractionOptions(r,correct,pairs){let opts=[String(correct)];for(let [a,b] of r.shuffle(pairs)){if(!b)continue;let s=fstr(a,b);if(!opts.includes(s))opts.push(s);if(opts.length===4)break;}let i=0;while(opts.length<4&&i++<45){let s=fstr(r.int(1,15),r.int(2,12));if(!opts.includes(s))opts.push(s)}return r.shuffle(opts);}
function templatesFor(lesson,level,enabled){let t=templates.filter(x=>(lesson==='mixed'||x.lesson===lesson)&&(!enabled||enabled[x.id]!==false));if(level==='easy')t=t.filter(x=>x.level<=1);else if(level==='medium')t=t.filter(x=>x.level<=2);if(!t.length)t=templates.filter(x=>(lesson==='mixed'||x.lesson===lesson)&&(!enabled||enabled[x.id]!==false));return t;}
function createQuestion(seed,lesson='mixed',difficulty='medium',enabled){const r=rng(seed),pool=templatesFor(lesson,difficulty,enabled);if(!pool.length)throw Error('لا توجد قوالب مفعّلة لهذا التدريب');const t=r.pick(pool),q=t.make(r);return {...q,templateId:t.id,templateName:t.name,lesson:t.lesson,level:t.level,kind:t.kind,subskill:t.subskill,seed:seed>>>0};}
function generateBatch(seed,lesson,difficulty,count,enabled){let out=[],seen=new Set(),s=seed>>>0,attempts=0;while(out.length<count && attempts++<count*350){s=(s+0x9e3779b9)>>>0;const q=createQuestion(s,lesson,difficulty,enabled);if(seen.has(q.signature))continue;out.push(q);seen.add(q.signature);}if(out.length!==count)throw Error(`عينة الأسئلة المتاحة لهذه الإعدادات غير كافية (${out.length}/${count}). اختر مستوى مختلفًا أو فعّل قوالب أكثر.`);return out;}

function getMastery(lesson,student=db.student){return E.mastery(responsesFor(student),lesson)}
function lessonCard(l){const m=getMastery(l.id),c=l.id==='fractions'?'mint':l.id==='geometry'?'orange':'';return `<article class="lesson-card"><header><div class="lesson-symbol ${c}">${l.icon}</div><span class="pill ${m.total?'':'gray'}">${m.total?esc(m.level):'لم تبدأ'}</span></header><h3>${l.title}</h3><p>${l.description}</p><div class="progress"><i style="width:${m.score}%"></i></div><small class="muted">${m.score}% إتقان تقريبي · ${m.total} إجابة</small><button class="btn block" data-open-lesson="${l.id}">افتح الدرس ←</button></article>`}
function activeNotice(){if(!db.active)return '';const a=db.active,count=Array.isArray(a.questions)?a.questions.length:0;return `<div class="panel" style="border-color:var(--teal);margin:15px 0"><div class="home-shortcut" style="flex-wrap:wrap"><div><b>⏯ لديك محاولة محفوظة</b><div class="muted tiny">${esc(a.title||'تدريب سابق')} · السؤال ${Math.min(Number(a.index||0)+1,count)} من ${count}</div><small class="muted">يمكنك إكمالها أو اختيار درس جديد؛ المحاولات المكتملة محفوظة.</small></div><div class="toolbar"><button class="btn primary" data-action="resume">إكمال السابق</button><button class="btn" data-page="catalog">اختيار تدريب جديد</button></div></div></div>`}
function home(){
 const at=studentsAttempt(),rs=responsesFor(),ok=rs.filter(x=>x.correct).length;
 return `<section class="student-welcome"><div><div class="eyebrow">مساحة الطالب <span class="dot"></span> ${esc(db.grade)} • فصل تجريبي</div><h1>كل سؤال جديد،<br><span>خطوة نحو الإتقان.</span></h1><p>اختر درسًا وابدأ الحل. ستظهر لك أسئلة متجددة مع شرح واضح لكل خطوة.</p><div class="home-actions"><button class="btn primary btn-large" data-page="catalog">ابدأ من دروسي <span>←</span></button><button class="btn btn-large" data-action="quick">تدريب سريع · 5 أسئلة</button></div></div><div class="student-hero-art" aria-hidden="true"><div class="hero-spark">✦</div><div class="math-orbit"><div class="equation-pill">3x + 4 = 19</div><div class="math-main-icon">∑</div><div class="fraction-pill">½ + ¼</div></div></div></section>
 ${activeNotice()}
 <div class="welcome-mini-stats"><div><span>محاولاتي</span><b>${at.length}</b></div><div><span>دقة الإجابات</span><b>${percent(ok,rs.length)}%</b></div><div><span>نقاط التعلم</span><b>${rewards(db.student).xp}</b></div></div>
 ${heading('كيف تحب تبدأ اليوم؟','اختر نشاطًا واحدًا فقط وابدأ فورًا')}

 ${heading('الصف السابع · وحداتي','اختر وحدة ثم درسًا ثم موضوع التدريب',link('catalog','عرض جميع الدروس','sm'))}
 <div class="simple-lesson-list">${g7Recommended()}</div>
 <div class="quiet-note">الوحدات والدروس وفق فهرس كتاب التمارين الرسمي للصف السابع (الفصل الأول). الموضوعات التفصيلية تنظيم تدريبي خاص بـ TAG.</div>`;
}
function catalog(){
 return `<div class="simple-page-head"><button class="crumb-back" data-page="home">→ مساحة الطالب</button><span class="eyebrow">رحلة التعلم</span><h1>اختر درسًا وابدأ.</h1><p>ثلاث مهارات تدريبية متاحة للتجربة، وكل مرة تحصل على أسئلة جديدة.</p></div>
 <div class="simple-filter"><div class="filter-icon">▦</div><label for="gradeSelect">الصف الدراسي</label><select class="select" id="gradeSelect">${['السادس','السابع','الثامن','التاسع','العاشر'].map(x=>`<option ${db.grade===x?'selected':''}>${x}</option>`).join('')}</select><span>الفصل الأول (تجريبي)</span></div>
 ${db.grade==='السابع'?`<div class="catalog-list">${lessons.map(l=>{const m=getMastery(l.id);return `<button class="catalog-lesson" data-open-lesson="${l.id}"><div class="catalog-glyph ${l.id}">${l.icon}</div><div class="catalog-details"><span class="catalog-type">رياضيات • مختبر مهارات</span><h3>${esc(l.title)}</h3><p>${esc(l.description)}</p><small>${l.skills.length} مهارات · ${m.total?`${m.score}% تقدّم`:'جاهز للبدء'}</small></div><span class="catalog-action">ادخل الدرس ←</span></button>`}).join('')}</div><div class="under-actions">${link('unit','مراجعة مهارات الوحدة')}${link('diagnostic','قيّم مستواك')}</div>`:`<div class="panel empty"><div class="big">📚</div><h3>محتوى هذا الصف لم يُعتمد بعد</h3><p>نجهز المنهاج بعد مراجعته رسميًا. جرّب الآن مهارات الصف السابع.</p><button class="btn primary" data-action="grade7">الانتقال للصف السابع</button></div>`}
 <div class="quiet-note">${grade7}</div>`;
}
function lesson(){
 const l=lessons.find(x=>x.id===selectedLesson)||lessons[0],m=getMastery(l.id),count=db.preferences[l.id]?.count||10,diff=db.preferences[l.id]?.difficulty||'adaptive';
 return `<div class="simple-page-head"><button class="crumb-back" data-page="catalog">→ العودة للدروس</button><div class="lesson-eyebrow">${l.icon} • درس تفاعلي</div><h1>${esc(l.title)}</h1><p>${esc(l.description)}</p></div><div class="lesson-easy-layout"><section class="panel lesson-start-panel"><span class="eyebrow">ابدأ التدريب</span><h2>كم سؤالًا تريد أن تحل؟</h2><div class="lesson-num-choices">${[5,10,15,20,30].map(n=>`<button class="choice-chip ${n===count?'sel':''}" data-count="${n}">${n}</button>`).join('')}</div><div class="field compact-field"><label for="lessonDifficulty">المستوى</label><select id="lessonDifficulty" class="select"><option value="adaptive" ${diff==='adaptive'?'selected':''}>ذكي: يتكيف مع إجاباتي</option>${[['easy','سهل'],['medium','متوسط'],['hard','متقدم']].map(([v,t])=>`<option value="${v}" ${diff===v?'selected':''}>${t}</option>`).join('')}</select></div><button class="btn primary btn-block btn-large" data-action="lessonStart">ابدأ الآن · ${count} أسئلة ←</button><button class="btn btn-block" data-action="lessonExam">أريد اختبارًا دون مساعدة</button><p class="footnote">الإجابات تُصحح فورًا في وضع التدريب، ويمكنك المحاولة من جديد.</p></section><aside class="stack"><div class="panel lesson-info-panel"><span class="eyebrow">ماذا ستتعلم؟</span><div class="simple-skills">${l.goals.map((g,i)=>`<div><span class="skill-check">✓</span><span>${esc(g)}</span></div>`).join('')}</div></div><div class="panel last-progress"><span class="eyebrow">تقدمي في الدرس</span><div class="progress-score">${m.total?`${m.score}%`:'لم تبدأ'}</div><div class="progress"><i style="width:${m.score}%"></i></div><small>${m.total} إجابات مسجلة • ${m.level}</small></div></aside></div>`;
}
function daily(){const today=new Date().toLocaleDateString('en-CA'),a=studentsAttempt().filter(a=>a.source==='daily'),days=new Set(a.map(x=>new Date(x.finished).toLocaleDateString('en-CA'))),done=days.has(today);let streak=0,day=new Date();while(days.has(day.toLocaleDateString('en-CA'))){streak++;day.setDate(day.getDate()-1)};return `${heading('☀️ تدريب اليوم','استثمر 10 دقائق لتقوية مهاراتك تدريجيًا')}<div class="grid3">${kv('✺',done?'مكتمل':'جاهز', 'حالة تدريب اليوم')}${kv('🔥',streak,'أيام تدريب متتالية')}${kv('✓',a.length,'تدريبات يومية مكتملة')}</div><div class="panel" style="margin-top:16px"><div class="home-shortcut"><div><span class="pill gold">تدريب متغير</span><h2 style="margin:10px 0">10 أسئلة على مهارات متنوعة</h2><p>المعادلات + الكسور + الهندسة. تصحيح فوري وتلميحات عند الحاجة.</p></div><div class="tool-emoji">🌞</div></div><button class="btn primary" data-action="startDaily">${done?'أعد التدريب بأسئلة مختلفة':'ابدأ تدريب اليوم'}</button></div>${heading('توصية تعليمية','هذه توصية بسيطة مبنية على إجاباتك السابقة')}<div class="panel">${recommendation(db.student)}</div>`}
function selectSkills(prefix,values=['equations','fractions','geometry']){return lessons.map(l=>`<label class="checkbox-line"><input type="checkbox" data-${prefix}-skill="${l.id}" ${values.includes(l.id)?'checked':''}> ${l.icon} ${l.title}</label>`).join('')}
function selftest(){return `${heading('🎯 أنشئ اختبارك الذاتي','اختر دروسًا متعددة ضمن هذه الوحدة التجريبية')}<div class="grid2"><div class="panel"><div class="field"><label>الدروس المشاركة</label>${selectSkills('self')}</div><div class="grid2"><div class="field"><label>العدد</label><select class="select" id="selfCount">${[5,10,15,20,30].map(n=>`<option ${n===10?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>الصعوبة</label><select class="select" id="selfDifficulty"><option value="easy">تأسيسي</option><option value="medium" selected>متوسط</option><option value="hard">متقدم</option></select></div></div><div class="field"><label>المدة</label><select class="select" id="selfMinutes"><option value="0">بدون مؤقت</option><option value="5">5 دقائق</option><option value="10" selected>10 دقائق</option><option value="20">20 دقيقة</option></select></div><button class="btn primary" data-action="createSelfTest">ابدأ الاختبار الذاتي</button></div><div class="panel"><h3>كيف يعمل الاختبار؟</h3><p>يولد النظام أسئلة مختلفة لكل محاولة، ويحفظ الإجابات محليًا. في وضع الاختبار تُخفى الإجابات والتلميحات إلى ما بعد إنهائه.</p><div class="warning">هذا ليس اختبارًا رسميًا مؤمنًا: تعمل الأسئلة والتصحيح على المتصفح، لذا لا تستخدمه لتقييم حقيقي أو بيانات طلاب حقيقية.</div></div></div>`}
function unit(){return `${heading('مراجعة الوحدة','تغطية متوازنة للدروس التجريبية الثلاثة')}<div class="grid3">${[[10,'سريعة','10 دقائق'],[20,'متوسطة','20 دقيقة'],[30,'شاملة','30 دقيقة']].map(([n,t,time])=>`<div class="tile"><span class="pill">${time}</span><h2 style="margin-top:13px">${n} سؤالًا</h2><p>مراجعة ${t} في المعادلات والكسور والهندسة بأسئلة جديدة.</p><button class="btn primary block" data-unit-count="${n}">ابدأ المراجعة</button></div>`).join('')}</div><div class="info" style="margin-top:15px">راجع أخطاءك بعد الانتهاء؛ هذا مثال وحدة مهارات، وليس عنوان وحدة رسمية من الكتاب.</div>`}
function labs(){
 const featured=['fraction','numberline','coordinate','protractor','clock','balance'];const main=L.TOOLS.filter(t=>featured.includes(t[0])),rest=L.TOOLS.filter(t=>!featured.includes(t[0]));
 const card=t=>`<button class="easy-lab-tile" data-lab-tool="${t[0]}"><span class="easy-lab-symbol">${t[1]}</span><b>${esc(t[2])}</b><small>${esc(t[3])}</small><span class="lab-open">جرب الأداة ←</span></button>`;
 return `<div class="simple-page-head"><button class="crumb-back" data-page="home">→ مساحة الطالب</button><span class="eyebrow">تعلّم باستخدام يديك</span><h1>مختبر الرياضيات</h1><p>اختر أداة واحدة. حرّك عناصرها بنفسك، ثم تحقق من إجابتك.</p></div><div class="featured-labs">${main.map(card).join('')}</div><details class="advanced-labs"><summary>عرض بقية الأدوات الرياضية (${rest.length}) <span>⌄</span></summary><div class="featured-labs">${rest.map(card).join('')}</div></details>`;
}
function assigned(){const allowed=db.assignments.filter(a=>a.classroom==='الكل'||a.classroom===db.classroom);return `${heading('واجباتي','تكليفات أنشأها المعلم داخل هذا المتصفح فقط',`<span class="pill">${allowed.length} تكليفات</span>`)}${allowed.length?`<div class="grid3">${allowed.map(t=>{const done=studentsAttempt().filter(a=>a.assignmentId===t.id).length,blocked=done>=t.attemptLimit,overdue=t.due&&new Date(t.due).getTime()<Date.now();return `<div class="tile"><span class="pill ${t.mode==='exam'?'gold':''}">${t.mode==='exam'?'اختبار':'تدريب'}</span><h3>${esc(t.title)}</h3><p>${t.skills.map(lessonName).join(' + ')}</p><small>${t.count} سؤالًا · ${t.minutes?`${t.minutes} دقيقة`:'بلا مؤقت'} · ${esc(t.classroom)} · ${done}/${t.attemptLimit} محاولة</small><div class="toolbar" style="margin-top:15px"><button class="btn primary" data-start-task="${esc(t.id)}" ${blocked||overdue?'disabled':''}>${blocked?'استنفدت المحاولات':overdue?'انتهت المهلة':'ابدأ التكليف'}</button></div></div>`}).join('')}</div>`:`<div class="panel empty"><div class="big">📋</div><h3>لا توجد واجبات لشعبتك</h3><p>بدّل العرض إلى المعلم وأنشئ اختبارًا ثم ارجع إليه كطالب تجريبي.</p><button class="btn primary" data-role="teacher">فتح لوحة المعلم</button></div>`}`}
function badgeAndXp(student){const rs=responsesFor(student),atts=studentsAttempt(student),correct=rs.filter(x=>x.correct).length;return {xp:correct*10+(rs.length-correct)*2+atts.length*12,badges:[['🌱','بداية رائعة',rs.length>=1],['📚','مثابر',rs.length>=30],['🥇','متقن الكسور',getMastery('fractions',student).level==='متقن'],['🎯','متقن المعادلات',getMastery('equations',student).level==='متقن'],['📐','بطل الهندسة',getMastery('geometry',student).level==='متقن'],['💪','100 إجابة',rs.length>=100]]}}
function rewards(student){return badgeAndXp(student)}
function skillMap(rs){return `<div class="stack">${lessons.map(l=>{const m=E.mastery(rs,l.id);return `<div><div class="home-shortcut"><strong>${l.icon} ${l.title}</strong><span class="pill gray">${m.level} · ${m.total} إجابة</span></div><div class="progress" style="margin:8px 0"><i style="width:${m.score}%"></i></div><small class="muted">${m.score}% إتقان تقديري</small></div>`}).join('')}</div>`}
function recommendation(student){const rs=responsesFor(student);if(rs.length===0)return 'ابدأ تدريبًا من المعادلات أو الكسور أو الهندسة، وسيظهر هنا الدرس الذي يحتاج إلى مراجعة.';const ratings=lessons.map(l=>({...l,m:E.mastery(rs,l.id)})).sort((a,b)=>a.m.score-b.m.score);const weak=ratings[0];return `<strong>اقترح مراجعة: ${weak.title}</strong><p style="margin:5px 0">التقدير الحالي: ${weak.m.score}% (${weak.m.total} إجابات). ابدأ بخمس مسائل جديدة مع التلميحات.</p><button class="btn sm primary" data-practice-lesson="${weak.id}">تدريب علاجي</button>`}
function progressChart(atts){const arr=atts.slice(-10),vals=arr.map(a=>percent(a.correct,a.count));if(vals.length<2)return `<div class="empty">أكمل محاولتين على الأقل لعرض منحنى تطور الدقة.</div>`;let path=vals.map((v,i)=>`${i?'L':'M'}${35+i*330/Math.max(vals.length-1,1)},${185-v*1.5}`).join(' ');return `<svg viewBox="0 0 400 220" width="100%" role="img" aria-label="تطور دقة الإجابات عبر المحاولات"><line x1="32" x2="380" y1="185" y2="185" stroke="var(--border)"/><line x1="32" x2="32" y1="30" y2="185" stroke="var(--border)"/><text x="6" y="37" fill="var(--muted)" font-size="10">100%</text><text x="15" y="189" fill="var(--muted)" font-size="10">0</text><path d="${path}" fill="none" stroke="var(--teal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${35+i*330/Math.max(vals.length-1,1)}" cy="${185-v*1.5}" r="5" fill="var(--gold)"/><text x="${35+i*330/Math.max(vals.length-1,1)}" y="205" fill="var(--muted)" text-anchor="middle" font-size="10">${i+1}</text>`).join('')}</svg>`}
function progress(){const student=db.role==='parent'?linkedStudentName():db.student,rs=responsesFor(student),atts=studentsAttempt(student),correct=rs.filter(x=>x.correct).length,r=rewards(student);return `${heading('خريطة الإتقان','مستويات تقديرية تتحسن مع المحاولات المتكررة',`<span class="pill">${esc(student)}</span>`)}<div class="grid4">${kv('✓',rs.length,'إجابات')}${kv('◉',percent(correct,rs.length)+'%','الدقة الكلية')}${kv('✦',r.xp,'نقاط الخبرة')}${kv('▤',atts.length,'محاولات مكتملة')}</div><div class="grid2" style="margin-top:16px"><div class="panel"><h3>◈ خريطة المهارات</h3>${skillMap(rs)}</div><div class="panel"><h3>🏅 إنجازاتك التعليمية</h3><div class="grid2">${r.badges.map(([ico,name,got])=>`<div class="tile" style="text-align:center;opacity:${got?1:.42}"><div class="tool-emoji">${ico}</div><b>${name}</b><div class="tiny muted">${got?'مكتسب':'لم يُكتسب بعد'}</div></div>`).join('')}</div></div></div>${heading('تطور الأداء','المحاولات الأخيرة بالدقة المئوية')}<div class="panel">${progressChart(atts)}${attemptList(atts)}</div><div class="info" style="margin-top:14px">لا تُستنتج «درجة إتقان» راسخة من محاولة قصيرة. المستوى هنا مؤشر تربوي أولي مستند إلى الدقة وعدد الإجابات.</div>`}
function attemptList(atts){return atts.length?atts.slice().reverse().slice(0,20).map(a=>`<div class="list-row"><div><b>${esc(a.title)}</b><small>${fmtDate(a.finished)} · ${a.count} سؤالًا · ${secs(a.duration||0)} · ${esc(a.student)}</small></div><div class="toolbar"><b>${percent(a.correct,a.count)}%</b><button class="btn sm" data-show-attempt="${esc(a.id)}">التفاصيل</button></div></div>`).join(''):'<div class="empty">لا توجد محاولات مكتملة حتى الآن.</div>'}

function reports(){let at=db.attempts.filter(x=>(filterClass==='all'||x.classroom===filterClass)&&(filterStudent==='all'||x.student===filterStudent));let rs=at.flatMap(a=>a.responses||[]),correct=rs.filter(x=>x.correct).length,byClass=['السابع أ','السابع ب'].map(c=>{let a=at.filter(x=>x.classroom===c),rs=a.flatMap(a=>a.responses||[]);return {c,total:a.length,rate:percent(rs.filter(x=>x.correct).length,rs.length)}});let errors=rs.filter(x=>!x.correct),errCount={};errors.forEach(x=>{errCount[x.subskill]=(errCount[x.subskill]||0)+1});let common=Object.entries(errCount).sort((a,b)=>b[1]-a[1]).slice(0,7);return `${heading('تقارير وتحليل الأداء','لا تظهر بيانات إلا بعد حل أسئلة فعلية على هذا المتصفح',`<button class="btn" data-action="exportReports">⬇ تصدير Excel CSV</button>`)}<div class="grid2"><div class="field"><label>تصفية حسب الشعبة</label><select class="select" id="reportClass"><option value="all">جميع الشعب</option>${['السابع أ','السابع ب'].map(c=>`<option ${filterClass===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>تصفية حسب الطالب</label><select class="select" id="reportStudent"><option value="all">جميع الطلاب</option>${db.students.map(s=>`<option ${filterStudent===s.name?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div><div class="grid4">${kv('◉',at.length,'محاولات مكتملة')}${kv('◎',percent(correct,rs.length)+'%','الدقة')}${kv('▤',rs.length,'أسئلة محلولة')}${kv('◈',errors.length,'إجابات خاطئة')}</div><div class="grid2" style="margin-top:15px"><div class="panel"><h3>إتقان المهارات</h3>${skillMap(rs)}</div><div class="panel"><h3>الأخطاء الشائعة</h3>${common.length?common.map(([name,n])=>`<div class="list-row"><b>${esc(name)}</b><span class="pill gold">${n} أخطاء</span></div>`).join(''):'<div class="empty">لا توجد أخطاء مسجلة في النطاق المختار.</div>'}</div></div>${heading('أداء الشعب','نتائج محلية فعلية، ليست علامات رسمية')}<div class="grid2">${byClass.map(x=>`<div class="tile"><h3>${x.c}</h3><strong clas function g7DiagramData(q){

function g7TriangleSvg(d){

case 'selfTest':{let out=E.selfTest(100);const x=$('engineTest');if(x)x.innerHTML=`<div class="${out.failures.length?'warning':'info'}">فحص ${out.checked} حالة عبر ${Object.keys(out.seenByTemplate).length} قالبًا: ${out.failures.length?'أخطاء '+out.failures.length:'0 أخطاء في نطاق الفحوص'}</div>`;return}case 'resetTemplates':db.disabled={};save();render();return;case 'createTemplate':createTemplate();return;case 'addDraft':{let title=($('draftTitle')?.value||'').trim().slice(0,70),source=($('draftSource')?.value||'').trim().slice(0,300);if(!title||!source)return toast('أدخل العنوان وملاحظة المصدر المطلوبة');db.draftLessons.push({id:uid(),title,source,created:now(),approved:false});save();render();toast('حُفظت المسودة دون نشر');return}
case 'exportReports':exportCSV(false);return;case 'exportPersonal':exportCSV(true);return;case 'print':window.print();return;case 'exportJSON':download('TAG-Math-Backup.json',JSON.stringify({...db,active:null},null,2),'application/json;charset=utf-8');return;case 'resetLocal':confirmReset();return;case 'confirmReset':localStorage.removeItem(key);db=defaults();closeModal();navigate('home');toast('تم مسح بيانات التجربة من هذا المتصفح');return;case 'closeModal':closeModal();return;case 'labs':navigate('labs');return;}
}
document.addEventListener('click',e=>{let b=e.target.closest('[data-role]');if(b){setRole(b.dataset.role);return}b=e.target.closest('[data-page]');if(b){navigate(b.dataset.page);return}b=e.target.closest('[data-open-lesson]');if(b){selectedLesson=b.dataset.openLesson;navigate('lesson');return}b=e.target.closest('[data-practice-lesson]');if(b){startSession({title:'تدريب علاجي: '+lessonName(b.dataset.practiceLesson),skills:[b.dataset.practiceLesson],count:5,level:'easy',adaptive:true,hints:true,source:'remedial'});return}b=e.target.closest('[data-count]');if(b){db.preferences[selectedLesson]={...db.preferences[selectedLesson],count:Number(b.dataset.count)};save();render();return}b=e.target.closest('[data-unit-count]');if(b){startSession({title:'مراجعة وحدة المهارات',skills:['equations','fractions','geometry'],count:Number(b.dataset.unitCount),level:'medium',hints:true,source:'unit'});return}b=e.target.closest('[data-start-task]');if(b){startTask(b.dataset.startTask);return}b=e.target.closest('[data-delete-task]');if(b){if(!confirm('حذف التكليف التجريبي؟'))return;db.assignments=db.assignments.filter(t=>t.id!==b.dataset.deleteTask);save();render();return}b=e.target.closest('[data-choose-student]');if(b){const s=db.students.find(x=>x.id===b.dataset.chooseStudent);if(s){db.student=s.name;db.classroom=s.classroom;db.role='student';save();navigate('home')}return}b=e.target.closest('[data-remove-student]');if(b){db.students=db.students.filter(s=>s.id!==b.dataset.removeStudent);save();render();return}b=e.target.closest('[data-show-attempt]');if(b){showAttempt(b.dataset.showAttempt);return}b=e.target.closest('[data-custom-toggle]');if(b){let x=db.customTemplates.find(t=>t.id===b.dataset.customToggle);if(x){x.active=!x.active;save();render()}return}b=e.target.closest('[data-approve-template]');if(b){let x=db.customTemplates.find(t=>t.id===b.dataset.approveTemplate);if(x&&x.testsPassed>=100){x.approved=true;x.active=true;save();render();toast('اعتمد القالب داخل البيئة التجريبية فقط')}return}b=e.target.closest('[data-custom-delete]');if(b){db.customTemplates=db.customTemplates.filter(t=>t.id!==b.dataset.customDelete);save();render();return}b=e.target.closest('[data-delete-draft]');if(b){db.draftLessons=db.draftLessons.filter(t=>t.id!==b.dataset.deleteDraft);save();render();return}b=e.target.closest('[data-lab-tool]');if(b){selectedTool=b.dataset.labTool;L.select(selectedTool);navigate('lab');return}b=e.target.closest('[data-lab]');if(b){const n=b.dataset.lab;if(n==='back'){navigate('labs');return}const r=L.action(n,b);if(r==='render')render();if(r==='renderMessage'){const box=$('labResult');if(box)box.textContent=L.render().match(/<div id="labResult"[^>]*>(.*?)<\/div>/s)?.[1]?.replace(/<[^>]+>/g,'')||''}return}b=e.target.closest('[data-lab-pick],[data-lab-val],[data-lab-point],[data-lab-left],[data-lab-right]');if(b){if(L.clickData(b))render();return}b=e.target.closest('[data-shade]');if(b&&db.active){let n=Number(b.dataset.shade);picks=picks.includes(n)?picks.filter(i=>i!==n):[...picks,n];answer=String(picks.length);render();return}b=e.target.closest('[data-sequence]');if(b){let p=answer?String(answer).split(','):[];if(!p.includes(b.dataset.sequence))p.push(b.dataset.sequence);answer=p.join(',');render();return}b=e.target.closest('[data-answer]');if(b){answer=b.dataset.answer;render();return}b=e.target.closest('[data-action]');if(b){action(b.dataset.action,b);return}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='gradeSelect'){db.grade=t.value;save();render()}if(t.id==='lessonDifficulty'){db.preferences[selectedLesson]={...db.preferences[selectedLesson],difficulty:t.value};save()}if(t.id==='reportClass'){filterClass=t.value;render()}if(t.id==='reportStudent'){filterStudent=t.value;render()}if(t.id==='parentChild'){db.linkedChild=t.value;save();render()}if(t.id==='currentStudent'){const s=db.students.find(x=>x.id===t.value);if(s){db.student=s.name;db.classroom=s.classroom;save();render()}}if(t.dataset.toggleTemplate){db.disabled[t.dataset.toggleTemplate]=!t.checked;save();toast(t.checked?'القالب مفعل':'عُطّل القالب محليًا')}if(t.id==='angleAnswer'){answer=t.value;render()}if(t.dataset.labInput){const r=L.input(t);if(r==='render')render()}});
document.addEventListener('click',e=>{const op=e.target.closest('[data-eq-balance]');if(op){const step=op.dataset.eqBalance;if(step==='reset')balanceStep=0;else if((balanceStep===0&&step==='subtract')||(balanceStep===1&&step==='divide')||(balanceStep===2&&step==='check'))balanceStep++;render();return}const remedial=e.target.closest('[data-eq-retrain]');if(remedial){db.g7.unitId='u3';db.g7.lessonId='u3l1';db.g7.topicIds=[remedial.dataset.eqRetrain];g7Start({lessonId:'u3l1',topicIds:[remedial.dataset.eqRetrain],mode:'practice',count:5,level:'easy',title:'تدريب علاجي: '+window.TAGEquationLesson.skillOf(remedial.dataset.eqRetrain).name});return}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='angleAnswer'){answer=t.value;const read=t.closest('.panel')?.querySelector('.lab-readout');if(read)read.textContent=t.value+'°';let svg=t.closest('.panel')?.querySelector('.qmath svg');if(svg){let deg=Number(t.value)*Math.PI/180,line=svg.querySelectorAll('line')[1];if(line){line.setAttribute('x2',145+100*Math.cos(deg));line.setAttribute('y2',145-100*Math.sin(deg))}}}if(t.id==='userAnswer')answer=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('sidebar')?.classList.remove('open');$('backdrop')?.classList.remove('open')}if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-answer')){e.preventDefault();answer=e.target.dataset.answer;render()}if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-lab-point')){e.preventDefault();if(L.clickData(e.target))render()}if(e.key==='Enter'&&e.target.id==='userAnswer'){e.preventDefault();markAnswer()}});
document.addEventListener('click',e=>{if(e.target.id==='backdrop'){$('sidebar')?.classList.remove('open');e.target.classList.remove('open')}if(e.target.id==='modal')closeModal()});
