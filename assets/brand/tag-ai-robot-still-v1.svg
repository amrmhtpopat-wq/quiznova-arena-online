<svg xmlns="http://www.w3.org/2000/svg" width="220" height="318" viewBox="0 0 220 318" role="img" aria-labelledby="tagTitle tagDesc">
<title id="tagTitle">TAG AI — الروبوت المساعد</title>
<desc id="tagDesc">روبوت طفولي ثلاثي الأبعاد بألوان بنفسجية وفيروزية، يطفو ببطء ويلوح بيده.</desc>
<defs>
<linearGradient id="shell" x1=".04" y1=".02" x2=".98" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".42" stop-color="#F8F7FF"/><stop offset=".75" stop-color="#DED8F3"/><stop offset="1" stop-color="#BBB4D9"/></linearGradient>
<linearGradient id="body" x1=".04" y1=".02" x2=".98" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".47" stop-color="#EDEBFD"/><stop offset=".82" stop-color="#C8C5E2"/><stop offset="1" stop-color="#9C99CB"/></linearGradient>
<linearGradient id="purple" x1="0" y1="0" x2=".91" y2="1"><stop stop-color="#BE82FF"/><stop offset=".38" stop-color="#8E52F2"/><stop offset=".73" stop-color="#6638DC"/><stop offset="1" stop-color="#4122A4"/></linearGradient>
<linearGradient id="cyan" x1=".03" y1=".04" x2=".95" y2=".98"><stop stop-color="#CEFFFC"/><stop offset=".31" stop-color="#63F6F6"/><stop offset=".68" stop-color="#10C5E9"/><stop offset="1" stop-color="#218FE9"/></linearGradient>
<radialGradient id="face" cx=".48" cy=".16" r=".95"><stop stop-color="#24233D"/><stop offset=".7" stop-color="#0D122D"/><stop offset="1" stop-color="#050A16"/></radialGradient>
<radialGradient id="shine" cx=".18" cy=".12" r=".96"><stop stop-color="#fff" stop-opacity=".58"/><stop offset=".3" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="eye" cx=".31" cy=".29" r=".76"><stop stop-color="#E9FFFF"/><stop offset=".29" stop-color="#68FBFF"/><stop offset=".78" stop-color="#11BBF1"/><stop offset="1" stop-color="#127DE1"/></radialGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3E1F8C" flood-opacity=".30"/></filter>
<filter id="glow" x="-60%" y="-65%" width="220%" height="230%"><feGaussianBlur stdDeviation="3.3"/></filter>
<filter id="inner" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#FFFFFF" flood-opacity=".6"/></filter>
</defs>
