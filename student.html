<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b2cff">
  <title>QuizNova Arena — الطالب</title>
  <link rel="stylesheet" href="student.css">
</head>
<body>
<div class="bg-orb orb-a"></div><div class="bg-orb orb-b"></div><div class="bg-orb orb-c"></div>
<main class="student-shell">
  <header class="student-brand">
    <div class="logo">Q</div>
    <div><b>QuizNova</b><small>ARENA • STUDENT</small></div>
    <span class="live-dot">LIVE</span>
  </header>

  <section id="joinView" class="join-wrap">
    <div class="join-visual" aria-hidden="true">
      <div class="visual-title">جاهز؟</div>
      <div class="visual-sub">ادخل التحدي وابدأ اللعب</div>
      <div class="shape-card red"><span>▲</span></div>
      <div class="shape-card blue"><span>◆</span></div>
      <div class="shape-card yellow"><span>●</span></div>
      <div class="shape-card green"><span>■</span></div>
      <div class="floating-score">+1000</div>
      <div class="floating-combo">🔥 COMBO ×3</div>
    </div>

    <div class="join-card panel-glass">
      <div class="eyebrow">انضم للعبة الصفية</div>
      <h1>ابدأ التحدي</h1>
      <p id="joinHint">امسح QR الظاهر على شاشة المعلم أو اكتب رمز اللعبة، ثم اكتب اسمك الحقيقي.</p>
      <label>رمز اللعبة
        <input id="roomCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000 000">
      </label>
      <label>اسم الطالب
        <input id="playerName" autocomplete="off" maxlength="60" placeholder="مثال: أحمد محمد">
      </label>
      <div class="join-features"><span>📷 QR</span><span>🔢 PIN</span><span>👥 فردي أو فرق</span></div>
      <button id="joinBtn" class="primary">دخول اللعبة <span>🚀</span></button>
      <div id="joinError" class="error"></div>
      <div class="privacy-note">🔒 لا تحتاج حسابًا أو بريدًا إلكترونيًا، واللعبة تعمل داخل شبكة المدرسة.</div>
    </div>
  </section>

  <section id="gameView" class="hidden"></section>
</main>
<script src="student.js"></script>
</body>
</html>
