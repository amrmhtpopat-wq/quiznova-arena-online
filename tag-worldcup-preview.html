</head><body class="v105-stage" data-stage-view="finished">
<main id="stage"></main><div class="tag28-demo-watermark">عرض تجريبي • أسماء ونقاط افتراضية</div>
<script src="/tag-stage-worldcup-v28.js?v=28.1"></script>
<script>
(() => {
 const featured=[
  {name:'أحمد',score:2450,avatar:'b01'},
  {name:'محمد',score:2220,avatar:'b02'},
  {name:'عمر',score:1980,avatar:'b03'},
  {name:'يوسف',score:1850,avatar:'b04'},
  {name:'خالد',score:1720,avatar:'b05'}
 ];
 const rest=Array.from({length:23},(_,i)=>({name:'طالب تجريبي '+(i+6),score:Math.max(120,1600-i*61),avatar:'b'+String((i%16)+1).padStart(2,'0')}));
 const report=[...featured,...rest];
 const logo='<img class="tag-official-logo tag-stage-logo" src="/assets/brand/tag-spatial-identity-v3.webp" alt="TAG" width="155" height="54">';
 const heading='<div class="stage-head"><div class="brand">'+logo+'</div><button type="button" class="bo-fullscreen" onclick="document.documentElement.requestFullscreen?.()">⛶ ملء الشاشة</button><div class="pin">DEMO</div></div>';
 window.TAGStageWorldCup.finale({status:'finished',playType:'individual',report,players:report,total:20},{head:heading,avatarPath:avatar=>'/assets/avatars3d/'+(avatar||'b01')+'.webp'});
})();
</script>
