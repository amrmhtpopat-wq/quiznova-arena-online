name: TAG Student Verify V1 — QA only (no deployment)
on:
  push:
    branches:
      - feature/tag-student-verify-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local test dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax validation only
        run: |
          python -m compileall -q student_verify.py solo_api.py server.py platform_api.py tests/test_student_verify_v1.py
          node --check student.js
          node --check solo-student-v120.js
          node --check student-verify-teacher-v1.js
      - name: Security contract end-to-end (local temporary SQLite)
        run: python -m unittest discover -s tests -p 'test_student_verify_v1.py' -v
      - name: Existing solo tests: no regression when verification disabled
        run: python -m unittest discover -s tests -p 'test_student_solo_v120.py' -v
      - name: Verify student grade and section permissions
        run: python -m unittest discover -s tests -p 'test_student_grade_scope_v128.py' -v
