name: QuizNova V10.4 Feature Lab
on:
  push:
    branches: [v10-4-feature-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Syntax checks
        run: |
          python -m compileall -q server.py platform_store.py platform_api.py platform_security.py
          node --check app.js
          node --check student.js
          node --check stage.js
          node --check portal.js
          node --check studio-auth.js
          node --check portal-security.js
      - name: End to end team assignment and numeric scoring
        run: python -m unittest discover -s tests -p 'test_feature_v104.py' -v
