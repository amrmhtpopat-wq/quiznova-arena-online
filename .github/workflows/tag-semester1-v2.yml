name: TAG Semester One Complete Curriculum
on:
  push:
    branches: [main, feature/teachgame-semester1-catalog-20261121]
    paths:
      - 'tag-semester1-*.js'
      - 'tag-semester1-*.css'
      - 'studio.html'
      - 'studio-auth.js'
      - 'app.js'
      - 'tests/test_tag_semester1_v2.cjs'
      - 'tests/test_tag_semester1_v3.cjs'
      - 'tests/test_tag_semester1_pedagogy_v4.cjs'
      - '.github/workflows/tag-semester1-v2.yml'
  pull_request:
    paths:
      - 'tag-semester1-*.js'
      - 'tag-semester1-*.css'
      - 'studio.html'
      - 'studio-auth.js'
      - 'app.js'
      - 'tests/test_tag_semester1_v2.cjs'
      - 'tests/test_tag_semester1_v3.cjs'
      - 'tests/test_tag_semester1_pedagogy_v4.cjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 29-packs compatibility regression
        run: node tests/test_tag_semester1_v2.cjs
      - name: Complete 153-pack acceptance including answer checks
        run: node tests/test_tag_semester1_v3.cjs
      - name: Pedagogical content and independent mathematics proof checks
        run: node tests/test_tag_semester1_pedagogy_v4.cjs
      - name: JavaScript parse checks
        run: |
          node --check tag-semester1-catalog-v2.js
          node --check tag-semester1-packs-v2.js
          node --check tag-semester1-math-v3.js
          node --check tag-semester1-digital-v3.js
          node --check tag-semester1-unified-v3.js
          node --check tag-semester1-library-v2.js
          node --check app.js
          node --check studio-auth.js
