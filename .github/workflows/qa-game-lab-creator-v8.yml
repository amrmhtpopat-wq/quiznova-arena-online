name: QA Game Lab Creator Studio V8

on:
  push:
    branches: [v10-5-final-candidate]
    paths:
      - game-lab-create.html
      - game-lab-create-v8.css
      - game-lab-create-v8.js
      - game-lab-creator-bridge-v8.js
      - game-lab-v4.js
      - game-lab-preview.html
      - game_lab_api.py
      - tests/browser_game_lab_creator_v8.py
      - tests/test_game_lab_creator_v8.py
      - tests/browser_game_lab_visual_v5.py
      - tests/browser_game_lab_v4_design.py
      - .github/workflows/qa-game-lab-creator-v8.yml
  workflow_dispatch:

jobs:
  browser-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JS and Python syntax
        run: |
          node --check game-lab-create-v8.js
          node --check game-lab-creator-bridge-v8.js
          node --check game-lab-v4.js
          python -m py_compile game_lab_api.py tests/test_game_lab_creator_v8.py
      - name: Backend choices and modes
        run: python -m unittest discover -s tests -p test_game_lab_creator_v8.py -v
      - name: Setup Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify 24 routes, custom choices, cloud save and publish UX
        run: python tests/browser_game_lab_creator_v8.py
      - name: Regression on V7/V6/V5/V4
        run: |
          python tests/browser_game_lab_visual_emotion_v7.py
          python tests/browser_game_lab_interaction_v6.py
          python tests/browser_game_lab_visual_v5.py
          python tests/browser_game_lab_v4_design.py
      - name: Backend game modes
        run: python -m unittest discover -s tests -p test_game_lab_modes_v3.py -v
