name: V10.5 hosted integration smoke test
on:
  push:
    branches: [v10-5-final-candidate]
    paths: [.github/workflows/v105-hosted-smoke.yml, tests/hosted_v105_smoke.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public Render V10.5 QA (synthetic data only)
        run: python tests/hosted_v105_smoke.py
