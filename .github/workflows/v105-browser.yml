name: QuizNova V10.5 real browser smoke test
on:
  push:
    branches: [v10-5-final-candidate]
    paths:
      - server.py
      - student.js
      - student.html
      - app.js
      - studio.html
      - portal.js
      - portal.css
      - v106-contrast.css
      - v107-prelaunch.css
      - platform_store.py
      - tests/browser_smoke_v105.py
      - .github/workflows/v105-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test actual browser on desktop and mobile
        run: python tests/browser_smoke_v105.py
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiznova-v105-browser-qa
          path: browser-qa-artifacts/
          if-no-files-found: ignore
