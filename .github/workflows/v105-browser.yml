name: BOOYAH student and teacher real browser tests
on:
  push:
    branches: [v10-5-final-candidate]
  pull_request:
    branches: [main]
    paths:
      - server.py
      - admin_api.py
      - admin.html
      - admin-v1.css
      - admin-v1.js
      - tests/browser_admin_v1.py
      - tests/browser_admin_v2.py
      - tests/browser_v121_features.py
      - tests/browser_responsive_v122.py
      - game-lab-preview.html
      - tests/browser_game_lab_v1.py
      - game-lab-play.html
      - game-lab-cloud-v2.js
      - game-lab-extra-v2.js
      - game-lab-extra-v2.css
      - game_lab_api.py
      - game_lab_pro.py
      - game_lab_live.py
      - tests/test_game_lab_pro.py
      - tests/browser_game_lab_cloud_v2.py
      - tests/browser_mobile_v123.py
      - booyah-mobile-v123.css
      - booyah-responsive-v122.css
      - avatar-names-v121.js
      - solo_api.py
      - solo-student-v120.js
      - booyah-entry-v120.css
      - booyah-student-v120.css
      - tests/browser_student_entry_v120.py
      - student.js
      - student.html
      - app.js
      - studio.html
      - portal.js
      - portal.css
      - v106-contrast.css
      - v107-prelaunch.css
      - booyah-classroom.css
      - booyah-contrast-v109.css
      - booyah-builder-v110.css
      - booyah-quiz-polish-v111.css
      - booyah-badge-v112.css
      - booyah-mascots-v112.css
      - assets/avatars-game/**
      - tests/browser_mascot_badge_v112.py
      - tests/browser_builder_v110.py
      - tests/browser_studio_routing_v112.py
      - portal.js
      - index.html
      - studio-auth.js
      - tests/browser_contrast_v109.py
      - platform_store.py
      - tests/browser_smoke_v105.py
      - .github/workflows/v105-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install chromium
      - name: Test actual browser on desktop and mobile
        run: |
          python tests/browser_game_lab_v1.py
          python tests/browser_game_lab_cloud_v2.py
          python tests/browser_stage_fit_v126.py
          python tests/browser_mobile_v123.py
          python tests/browser_responsive_v122.py
          python tests/browser_smoke_v105.py
          python tests/browser_contrast_v109.py
          python tests/browser_builder_v110.py
          python tests/browser_studio_routing_v112.py
          python tests/browser_mascot_badge_v112.py
          python tests/browser_student_entry_v120.py
          python tests/browser_admin_v1.py
          python tests/browser_admin_v2.py
          python tests/browser_v121_features.py
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiznova-v105-browser-qa
          path: browser-qa-artifacts/
          if-no-files-found: ignore
