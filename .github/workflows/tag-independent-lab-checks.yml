name: TAG Independent V1 LAB isolation tests
on:
  push:
    branches: ['feature/tag-independent-v1-lab']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile standalone routing and card client
        run: python -m py_compile tag_independent_mode.py tag_card_client.py tag_lab_cards.py game_lab_api.py server.py
      - name: Verify standalone route isolation
        run: python -m unittest discover -s tests -p 'test_tag_independent_mode.py' -v
      - name: Verify private card client
        run: python -m unittest discover -s tests -p 'test_tag_card_client.py' -v
      - name: Run synthetic roster and play flow
        run: python -m unittest discover -s tests -p 'test_tag_lab_cards.py' -v
      - name: Verify separate LAB portal scripts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ('tag-lab-assign','tag-lab-student'):
              content=Path(name+'.html').read_text(encoding='utf-8')
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',content,re.S)
              assert len(scripts)==1, (name,len(scripts))
              Path('/tmp/'+name+'.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/tag-lab-assign.js
          node --check /tmp/tag-lab-student.js
