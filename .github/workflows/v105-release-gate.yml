name: BOOYAH release and student portal gate
on:
  push:
    branches: [v10-5-final-candidate]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Python and JavaScript syntax validation
        run: |
          python -m compileall -q server.py platform_store.py platform_api.py platform_security.py solo_api.py game_lab_api.py game_lab_pro.py game_lab_live.py admin_api.py xlsx_report.py tests
          node --check game-lab-extra-v2.js
          node --check game-lab-cloud-v2.js
          node --check game-lab-pro-v3.js
          node --check game-lab-v4.js
          node --check game-lab-grade7-pilot.js
          node --check admin-v1.js
          node --check avatar-names-v121.js
          node --check booyah-countdown-v121.js
          node --check media_library.js
          node --check portal.js
          node --check student.js
          node --check stage.js
          node --check app.js
          node --check student.js
          node --check solo-student-v120.js
          node --check stage.js
          node --check portal.js
          node --check studio-auth.js
          node --check portal-security.js
          node --check curriculum_bank.js
          node --check curriculum_plus.js
          node --check media_library.js
      - name: Security, legacy games, typography, card XP and release regression tests
        run: |
          python -m unittest discover -s tests -p 'test_security.py' -v
          python -m unittest discover -s tests -p 'test_feature_v104.py' -v
          python -m unittest discover -s tests -p 'test_reference_v105.py' -v
          python -m unittest discover -s tests -p 'test_v105_final.py' -v
          python -m unittest discover -s tests -p 'test_prelaunch_v105.py' -v
          python -m unittest discover -s tests -p 'test_booyah_xp.py' -v
          python -m unittest discover -s tests -p 'test_mascot_badge_v112.py' -v
          python -m unittest discover -s tests -p 'test_student_solo_v120.py' -v
          python -m unittest discover -s tests -p 'test_game_lab_api.py' -v
          python -m unittest discover -s tests -p 'test_game_lab_pro.py' -v
          python -m unittest discover -s tests -p 'test_game_lab_modes_v3.py' -v
          python -m unittest discover -s tests -p 'test_game_lab_documents_v3.py' -v
          python -m unittest discover -s tests -p 'test_grade7_school_pilot.py' -v
          python -m unittest discover -s tests -p 'test_admin_v1.py' -v
          python -m unittest discover -s tests -p 'test_admin_v2.py' -v
          python -m unittest discover -s tests -p 'test_v121_cards_media_scenes.py' -v
      - name: Read-only production release smoke (no test users or mutations)
        run: python tests/hosted_production_readonly.py
