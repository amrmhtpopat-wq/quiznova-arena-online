name: TAG V27 Live Five and Podium Release
on:
  push:
    branches: [tag-live-stage-sequential-podium-v27, main]
    paths: ['stage.js','stage.html','tag-stage-cinematic-v27.js','tag-stage-cinematic-v27.css','tests/browser_tag_stage_cinematic_v27.py','.github/workflows/tag-v27-stage.yml']
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  projector:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Verify JavaScript parsers
        run: |
          node --check tag-stage-cinematic-v27.js
          node --check stage.js
      - name: Browser test live ranking, avatar podium, replay and privacy
        run: python -u tests/browser_tag_stage_cinematic_v27.py
      - name: Preserve existing QR and teacher authentication
        run: |
          python -m unittest discover -s tests -p 'test_tag_v23_release.py' -v
          python -m unittest discover -s tests -p 'test_tag_original_school_qr.py' -v
      - name: Save projector screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-v27-stage-390-and-1366
          path: artifacts/tag-v27/*.png
          if-no-files-found: ignore
