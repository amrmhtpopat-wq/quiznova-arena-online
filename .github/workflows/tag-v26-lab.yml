name: TAG V26 Installed App LAB Routing
on:
  push:
    branches: [tag-unified-origin-lab-app-v26, main]
    paths:
      - 'app.html'
      - 'tag-app-bridge-v2.js'
      - 'index.html'
      - 'tests/browser_tag_lab_pwa_v26.py'
      - '.github/workflows/tag-v26-lab.yml'
permissions: {contents: read}
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install chromium
      - name: Verify TAG LAB opens inside installed iPhone and Android app
        run: python -u tests/browser_tag_lab_pwa_v26.py
      - name: Existing PWA install and privacy contract
        run: python -m unittest discover -s tests -p 'test_tag_pwa_v1.py' -v
