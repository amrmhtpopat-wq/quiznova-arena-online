name: QuizNova V10.5 final visual asset import
on:
  push:
    branches: [v10-5-final-candidate]
    paths: [.github/tmp/v105-artwork.json]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Import stylized original costumes and new educational hero artwork
        run: |
          python - <<'PY'
          import io,json,urllib.request
          from pathlib import Path
          from PIL import Image,ImageOps
          manifest=Path('.github/tmp/v105-artwork.json')
          data=json.loads(manifest.read_text())
          assert len(data)==9 and {x['name'] for x in data}==({'n%02d'%n for n in range(1,9)}|{'learning'})
          for item in data:
              req=urllib.request.Request(item['url'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=50) as response:raw=response.read(20000000)
              if len(raw)<4000:raise ValueError('source image too small')
              image=Image.open(io.BytesIO(raw)).convert('RGB')
              if item['name']=='learning':
                  target=Path('assets/backgrounds/quiznova-learning.webp')
                  image=ImageOps.fit(image,(1160,653),method=Image.Resampling.LANCZOS)
                  image.save(target,'WEBP',quality=85,method=6)
              else:
                  target=Path('assets/avatars3d')/(item['name']+'.webp')
                  image=ImageOps.fit(image,(384,512),method=Image.Resampling.LANCZOS,centering=(.5,.5))
                  image.save(target,'WEBP',quality=84,method=6)
              print(target,target.stat().st_size)
          manifest.unlink()
          PY
      - name: Save local artwork into repository and clear temporary source URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/avatars3d/n*.webp assets/backgrounds/quiznova-learning.webp .github/tmp/v105-artwork.json
          git commit -m "Add original stylized Jordanian, professional and anime-adventure 3D avatars and educational homepage artwork"
          git push
