name: TAG LAB Phase 2 and 3 QA
on:
  push:
    branches: [v10-5-final-candidate]
    paths:
      - game_lab_pro.py
      - game_lab_api.py
      - game-lab-preview.html
      - game-lab-pro-v3.js
      - game-lab-cloud-v2.js
      - tests/test_game_lab_pro.py
      - tests/test_game_lab_api.py
      - .github/workflows/qa-tag-lab-phase23.yml
  workflow_dispatch:
jobs:
  phase23:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUIZNOVA_ALLOW_EPHEMERAL: 'yes'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Compile server and client
        run: |
          python -m py_compile game_lab_pro.py game_lab_api.py server.py
          node --check game-lab-pro-v3.js
          node --check game-lab-cloud-v2.js
          python - <<'PY'
          import re
          from pathlib import Path
          page=Path('game-lab-preview.html').read_text(encoding='utf-8')
          for marker in ('labBookSaveCloud','cloudImportFile','cloudLibrarySearch'):
              assert marker in page, marker
          inline=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',page)
          for index,part in enumerate(inline):
              if part.strip():Path('/tmp/tag-lab-inline-'+str(index)+'.js').write_text(part,encoding='utf-8')
          PY
          for f in /tmp/tag-lab-inline-*.js; do node --check "$f"; done
      - name: Verify explicit Arabic textbook Q&A and source pages
        run: |
          python - <<'PY'
          from game_lab_pro import explicit_qa_draft
          text='[صفحة 2]\nس: ما عاصمة الأردن؟\nج: عمّان\n[صفحة 3]\nس: كم حاصل ضرب 5 في 6؟ ج: 30'
          rows=explicit_qa_draft(text,8)
          assert len(rows)==2, rows
          assert [row['sourcePage'] for row in rows]==[2,3], rows
          assert [row['a'] for row in rows]==['عمّان','30'], rows
          print('Explicit Arabic Q&A and page traceability OK')
          PY
      - name: Textbook, privacy, activities and student regressions
        run: |
          python tests/test_game_lab_pro.py
          python tests/test_game_lab_api.py
