name: TAG LAB Phase 2 and 3 QA
on:
  push:
    branches: [v10-5-final-candidate]
    paths:
      - game_lab_pro.py
      - game_lab_ai_quality.py
      - tests/test_game_lab_ai.py
      - tag-lab-v11.css
      - game_lab_uploads.py
      - tests/test_game_lab_chunk_upload.py
      - tests/test_game_lab_quality.py
      - tests/browser_game_lab_pro_v3.py
      - game_lab_api.py
      - game-lab-preview.html
      - tag-lab-home.html
      - tag-lab-books.html
      - tag-lab-create.html
      - tag-lab-games.html
      - tag-lab-library.html
      - tag-lab-live.html
      - tag-lab-students.html
      - tag-lab-simple.css
      - tag-lab-simple.js
      - tag-lab-templates-v32.js
      - tag-lab-templates-v32.css
      - tag-lab-template-editor-v33.js
      - tag-lab-template-editor-v33.css
      - tag-lab-mixer.html
      - tag-lab-mixer-v34.js
      - tag-lab-student-card-bridge-v34.js
      - tests/browser_tag_lab_mixer_v34.py
      - tests/browser_tag_lab_templates_v32.py
      - tests/browser_tag_lab_simple_v31.py
      - game-lab-pro-v3.js
      - game-lab-cloud-v2.js
      - tests/test_game_lab_pro.py
      - tests/test_game_lab_api.py
      - .github/workflows/qa-tag-lab-phase23.yml
  workflow_dispatch:
jobs:
  phase23:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUIZNOVA_ALLOW_EPHEMERAL: 'yes'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Compile server and client
        run: |
          python -m py_compile game_lab_pro.py game_lab_ai_quality.py game_lab_uploads.py game_lab_api.py server.py
          node --check game-lab-pro-v3.js
          node --check game-lab-cloud-v2.js
          node --check tag-lab-simple.js
          node --check tag-lab-templates-v32.js
          node --check tag-lab-template-editor-v33.js
          node --check tag-lab-mixer-v34.js
          node --check tag-lab-student-card-bridge-v34.js
          python - <<'PY'
          import re
          from pathlib import Path
          page=Path('game-lab-preview.html').read_text(encoding='utf-8')
          for marker in ('labBookSaveCloud','cloudImportFile','cloudLibrarySearch','labAiDifficulty','labAiFocus'):
              assert marker in page, marker
          inline=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',page)
          for index,part in enumerate(inline):
              if part.strip():Path('/tmp/tag-lab-inline-'+str(index)+'.js').write_text(part,encoding='utf-8')
          PY
          for f in /tmp/tag-lab-inline-*.js; do node --check "$f"; done
      - name: Verify explicit Arabic textbook Q&A and source pages
        run: |
          python - <<'PY'
          import os, tempfile
          os.environ.pop('DATABASE_URL',None)
          temporary=tempfile.TemporaryDirectory()
          os.environ['QUIZNOVA_SQLITE_PATH']=temporary.name+'/phase23.sqlite'
          import platform_store
          platform_store.init()
          from game_lab_pro import explicit_qa_draft
          text='[صفحة 2]\nس: ما عاصمة الأردن؟\nج: عمّان\n[صفحة 3]\nس: كم حاصل ضرب 5 في 6؟ ج: 30'
          rows=explicit_qa_draft(text,8)
          assert len(rows)==2, rows
          assert [row['sourcePage'] for row in rows]==[2,3], rows
          assert [row['a'] for row in rows]==['عمّان','30'], rows
          print('Explicit Arabic Q&A and page traceability OK')
          PY
      - name: Textbook, privacy, activities and student regressions
        run: |
          python tests/test_game_lab_ai.py
          python tests/test_game_lab_quality.py
          python tests/test_game_lab_chunk_upload.py
          python tests/test_game_lab_pro.py
          python tests/test_game_lab_api.py
      - name: Install browser testing tools
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser review-to-save-to-card integration
        run: python tests/browser_game_lab_pro_v3.py
      - name: Separate pages and teacher workflow browser integration
        run: python tests/browser_tag_lab_simple_v31.py
      - name: Game-first template previews and switching browser integration
        run: python tests/browser_tag_lab_templates_v32.py
      - name: 'TAG integration: interactive lesson, official card and live challenge'
        run: python tests/browser_tag_lab_mixer_v34.py
