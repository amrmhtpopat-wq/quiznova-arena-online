name: TAG V25 Splash and FOUC Safety
on:
  push:
    branches: [tag-splash-and-fouc-v25, main]
    paths:
      - 'tag-spatial-site-v3.js'
      - 'index.html'
      - 'short-link/**'
      - 'tests/test_tag_splash_v25.py'
      - '.github/workflows/tag-v25-splash.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  splash-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate splash and dynamic mount syntax
        run: |
          node --check tag-spatial-site-v3.js
          node --check short-link/wake-loader.js
      - name: Automatic redirect, indexed homepage and QR regression
        run: |
          python -m unittest discover -s tests -p 'test_tag_splash_v25.py' -v
          python -m unittest discover -s tests -p 'test_tag_static_seo_landing_v19.py' -v
          python -m unittest discover -s tests -p 'test_tag_v23_release.py' -v
      - name: Playwright and server test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install chromium
      - name: Browser spatial CSS readiness and responsive home
        run: python -u tests/browser_tag_spatial_layout_v4.py
      - name: Browser student card and teacher navigation
        run: python -u tests/browser_tag_studio_navigation_v6.py
