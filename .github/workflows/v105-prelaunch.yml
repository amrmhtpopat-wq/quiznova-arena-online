name: QuizNova V10.5 release candidate tests
on:
  push:
    branches: [v10-5-final-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server packages
        run: python -m pip install -r requirements.txt
      - name: Python and JavaScript syntax checks
        run: |
          python -m compileall -q server.py platform_store.py platform_api.py platform_security.py
          node --check student.js
          node --check app.js
          node --check portal.js
          node --check stage.js
          node --check studio-auth.js
          node --check portal-security.js
      - name: End-to-end cards, privacy, scoring and persistence regression
        run: python -m unittest discover -s tests -p 'test_prelaunch_v105.py' -v
      - name: Previous feature and team regression
        run: python -m unittest discover -s tests -p 'test_feature_v104.py' -v
