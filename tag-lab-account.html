<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#F8F9FF">
<script src="/tag-lab-auth-guard-v40.js?v=40.0"></script>
<title>TAG LAB | حساب المعلم</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/tag-icon.svg">
<link rel="stylesheet" href="/tag-lab-visual-v1.css?v=1.4.0">
<style>
*{box-sizing:border-box}body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#edf6fb;color:#153c5d;margin:0;line-height:1.7}
main.account-main{width:min(100%,1000px);padding:30px 19px;margin:0 auto}
.account-hero{background:linear-gradient(120deg,#073c78,#0786ac);border-radius:22px;color:#fff;padding:25px 30px;margin-bottom:22px}
.account-hero h1{margin:0;font-size:clamp(1.4rem,3vw,2rem);color:#fff}
.account-hero p{color:#e5f7ff;margin:6px 0 0}
.account-card{border:1px solid #d4e4ef;background:#fff;border-radius:20px;padding:26px;box-shadow:0 8px 30px #1b43651b}
.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:18px 0 24px}
.account-field{background:#f2f8fc;border:1px solid #dae9f4;border-radius:12px;padding:12px 15px;min-width:0}
.account-field small{display:block;color:#5d7691;font-size:.8rem;font-weight:850}
.account-field b{display:block;color:#143d63;overflow-wrap:anywhere;font-size:.97rem}
.account-actions{display:flex;flex-wrap:wrap;gap:11px}
.account-actions a,.account-actions button{display:inline-flex;justify-content:center;align-items:center;min-height:44px;gap:8px;padding:9px 16px;border:0;border-radius:11px;font:800 .86rem Tahoma,Arial,sans-serif;cursor:pointer;text-decoration:none;background:#086ba8;color:#fff}
.account-actions button{background:#e6f2fa;color:#115579;border:1px solid #c2d9e9}
#accountStatus{font-weight:750;color:#376a7a}
@media(max-width:650px){main.account-main{padding:15px 12px}.account-grid{grid-template-columns:1fr}.account-card{padding:17px}.account-hero{padding:19px}}
</style></head><body>
<main class="account-main"><section class="account-hero"><h1>👤 حسابي في TAG LAB</h1><p>بيانات حساب المعلم ومكتبته في المختبر المستقل.</p></section>
<section class="account-card" aria-label="معلومات حساب المعلم">
<h2>معلومات الحساب</h2><p id="accountStatus" role="status" aria-live="polite">جارٍ تحميل معلومات حسابك...</p>
<div class="account-grid" id="accountDetails" hidden>
 <div class="account-field"><small>اسم المعلم</small><b id="teacherName">—</b></div>
 <div class="account-field"><small>البريد الإلكتروني</small><b id="teacherEmail" dir="ltr">—</b></div>
 <div class="account-field"><small>المدرسة</small><b id="teacherSchool">—</b></div>
 <div class="account-field"><small>المبحث</small><b id="teacherSubject">—</b></div>
</div>
<div class="account-actions">
 <a href="/tag-lab-home.html">🏠 لوحة TAG LAB</a>
 <a href="/tag-lab-library.html">🗂️ مكتبتي</a>
 <button type="button" id="logout">تسجيل الخروج</button>
</div>
</section>
</main>
<script>
(()=>{'use strict';const key='qn9_teacher_token',$=id=>document.getElementById(id);
const token=localStorage.getItem(key)||'';
if(!token)return;
fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token},cache:'no-store'}).then(async response=>{
 if(!response.ok)throw Error('login_required');
 const data=await response.json();if(!data.ok||!data.teacher)throw Error('login_required');
 const teacher=data.teacher;
 for(const [key,value] of Object.entries({teacherName:teacher.name,teacherEmail:teacher.email,teacherSchool:teacher.school,teacherSubject:teacher.subject})){
  $(key).textContent=value||'غير محدد'
 }
 $('accountDetails').hidden=false;$('accountStatus').textContent='✓ حسابك متصل بمكتبتك الخاصة.'
}).catch(()=>{$('accountStatus').textContent='تعذر تحميل معلومات الحساب. يمكنك إعادة فتح الصفحة أو تسجيل الدخول.'});
$('logout').onclick=async()=>{
 $('logout').disabled=true;
 try{await fetch('/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}',cache:'no-store'})}catch(_){}
 localStorage.removeItem(key);location.replace('/tag-lab-login.html')
};
})();
</script>
<script src="/tag-lab-visual-v1.js?v=1.4.0" defer></script></body></html>
